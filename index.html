<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dryfu Secure Diary</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #eef2f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* Login Styles */
        #loginScreen { background: white; width: 100%; max-width: 350px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        #loginScreen h2 { color: #2563eb; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #64748b; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 1rem; }
        .login-btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }

        /* App Container (Hidden initially) */
        #appContainer { display: none; background: #ffffff; width: 100%; max-width: 400px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; position: relative; flex-direction: column; height: 100vh; max-height: 850px; }
        
        .header { background-color: #2563eb; color: white; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; font-weight: 600; }
        .logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; cursor: pointer; }

        /* Calendar & Grid Styles (Boxy Design) */
        .calendar-section { padding: 15px; border-bottom: 1px solid #f0f0f0; background: #fafafa; }
        .month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .month-nav button { background: white; border: 1px solid #e2e8f0; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 42px); gap: 1px; background: #e2e8f0; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
        .day { display: flex; justify-content: flex-start; padding: 4px; background: #ffffff; font-size: 0.9rem; cursor: pointer; position: relative; }
        .day.selected { background-color: #eff6ff; color: #2563eb; font-weight: 700; box-shadow: inset 0 0 0 1px #3b82f6; }
        .day.has-doc { border-bottom: 3px solid #3b82f6; }
        .day.empty { background: #f1f5f9; cursor: default; }

        .details-section { padding: 20px; background: white; flex-grow: 1; overflow-y: auto; }
        .add-btn { background-color: #2563eb; color: white; border: none; width: 38px; height: 38px; border-radius: 8px; cursor: pointer; }
        .doc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .img-wrapper { position: relative; width: 100%; height: 110px; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }
        .doc-item { width: 100%; height: 100%; object-fit: cover; }
        .delete-btn { position: absolute; top: 4px; right: 4px; background: #ef4444; color: white; border: none; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; }

        /* Modal & Slider */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; }
        .modal-content { max-width: 95%; max-height: 80%; }
        .nav-btn { position: absolute; top: 50%; background: rgba(255,255,255,0.2); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }
        
        @media (max-width: 500px) { body { align-items: flex-start; } #appContainer { max-width: 100%; height: 100vh; max-height: none; border-radius: 0; } }
    </style>
</head>
<body>

    <div id="loginScreen">
        <i class="fa-solid fa-lock" style="font-size: 3rem; color: #2563eb; margin-bottom: 15px;"></i>
        <h2>Dryfu Login</h2>
        <div class="input-group">
            <label>Email ID</label>
            <input type="email" id="loginEmail" placeholder="अपना ईमेल डालें">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="loginPass" placeholder="पासवर्ड डालें">
        </div>
        <button class="login-btn" onclick="handleLogin()">Login Karein</button>
        <p id="loginError" style="color: red; font-size: 0.8rem; margin-top: 10px; display: none;"></p>
    </div>

    <div id="appContainer">
        <div class="header">
            <span><i class="fa-solid fa-cloud"></i> Dryfu Diary</span>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div class="calendar-section">
            <div class="month-nav">
                <button onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <h3 id="monthDisplay"></h3>
                <button onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="days-grid" id="calendarDays"></div>
        </div>

        <div class="details-section">
            <div id="selectedState">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h4 id="displayDate">Tarik Chunein</h4>
                    <button class="add-btn" onclick="toggleUpload()"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div id="uploadBox" style="display:none; margin: 15px 0; padding: 15px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; justify-content: space-around;">
                    <div onclick="document.getElementById('cameraInput').click()" style="cursor:pointer; text-align:center;">
                        <i class="fa-solid fa-camera" style="font-size: 1.5rem; color: #2563eb;"></i><br><span style="font-size:0.7rem;">Camera</span>
                    </div>
                    <div onclick="document.getElementById('galleryInput').click()" style="cursor:pointer; text-align:center;">
                        <i class="fa-solid fa-image" style="font-size: 1.5rem; color: #8b5cf6;"></i><br><span style="font-size:0.7rem;">Gallery</span>
                    </div>
                </div>
                <div id="savedDocsContainer"></div>
            </div>
        </div>
    </div>

    <input type="file" id="cameraInput" style="display:none" accept="image/*" capture="environment" onchange="savePhoto(event)">
    <input type="file" id="galleryInput" style="display:none" accept="image/*" onchange="savePhoto(event)">

    <div id="imageModal" class="modal" onclick="closeModal(event)">
        <button class="nav-btn" style="left:10px;" onclick="slide(-1, event)"><i class="fa-solid fa-chevron-left"></i></button>
        <img class="modal-content" id="fullImage">
        <button class="nav-btn" style="right:10px;" onclick="slide(1, event)"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA8jR1LbYSRmm-fAo3i5QChPqfCk1VUKgU",
            authDomain: "salebook-7405d.firebaseapp.com",
            projectId: "salebook-7405d",
            databaseURL: "https://salebook-7405d-default-rtdb.firebaseio.com/",
            appId: "1:193240940932:web:46fd3793cb7e2f10deddd1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let nav = 0, selectedDate = "", cloudData = {}, globalImages = [], globalIdx = 0;

        // --- AUTH LOGIC ---
        function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            auth.signInWithEmailAndPassword(email, pass).catch(err => {
                const errEl = document.getElementById('loginError');
                errEl.innerText = "गलत ईमेल या पासवर्ड!";
                errEl.style.display = "block";
            });
        }

        function handleLogout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
                syncData();
            } else {
                document.getElementById('loginScreen').style.display = 'block';
                document.getElementById('appContainer').style.display = 'none';
            }
        });

        // --- APP LOGIC ---
        function syncData() {
            db.ref("documents").on('value', snap => {
                cloudData = snap.val() || {};
                renderCalendar();
                if(selectedDate) renderDocs(selectedDate);
            });
        }

        function renderCalendar() {
            const dt = new Date();
            if (nav !== 0) dt.setMonth(new Date().getMonth() + nav);
            const month = dt.getMonth(), year = dt.getFullYear();
            document.getElementById('monthDisplay').innerText = `${new Intl.DateTimeFormat('en-US',{month:'short'}).format(dt)} ${year}`;
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendarDays');
            grid.innerHTML = '';
            for(let i=1; i<=42; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day';
                if(i > firstDay && i <= firstDay + daysInMonth) {
                    const dNum = i - firstDay;
                    const dStr = `${year}-${(month+1).toString().padStart(2,'0')}-${dNum.toString().padStart(2,'0')}`;
                    dayDiv.innerText = dNum;
                    if(cloudData[dStr]) dayDiv.classList.add('has-doc');
                    if(dStr === selectedDate) dayDiv.classList.add('selected');
                    dayDiv.onclick = () => { selectedDate = dStr; document.getElementById('displayDate').innerText = dStr; renderCalendar(); renderDocs(dStr); };
                } else { dayDiv.classList.add('empty'); }
                grid.appendChild(dayDiv);
            }
        }

        function renderDocs(date) {
            const container = document.getElementById('savedDocsContainer');
            const docs = cloudData[date] || [];
            if(docs.length === 0) { container.innerHTML = `<p style="text-align:center; color:#94a3b8; margin-top:20px;">No docs.</p>`; return; }
            let html = '<div class="doc-grid">';
            docs.forEach((img, i) => {
                html += `<div class="img-wrapper" onclick="openFull('${date}',${i})"><img src="${img}" class="doc-item"><button class="delete-btn" onclick="deleteImg(${i},event)">X</button></div>`;
            });
            container.innerHTML = html + '</div>';
        }

        async function savePhoto(e) {
            const file = e.target.files[0]; if(!file || !selectedDate) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 1000; let w = img.width, h = img.height;
                    if(w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const base64 = canvas.toDataURL('image/jpeg', 0.6);
                    const current = cloudData[selectedDate] || [];
                    current.push(base64);
                    await db.ref(`documents/${selectedDate}`).set(current);
                    document.getElementById('uploadBox').style.display = 'none';
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.deleteImg = async (i, e) => { e.stopPropagation(); if(confirm("Delete?")) { let d = cloudData[selectedDate]; d.splice(i,1); if(d.length===0) await db.ref(`documents/${selectedDate}`).remove(); else await db.ref(`documents/${selectedDate}`).set(d); } };
        window.changeMonth = (v) => { nav += v; renderCalendar(); };
        window.toggleUpload = () => { const b = document.getElementById('uploadBox'); b.style.display = b.style.display === 'flex' ? 'none' : 'flex'; };

        function openFull(date, i) {
            globalImages = [];
            Object.keys(cloudData).sort().forEach(d => cloudData[d].forEach(img => globalImages.push({d, img})));
            globalIdx = globalImages.findIndex(item => item.d === date && item.img === cloudData[date][i]);
            updateModal(); document.getElementById('imageModal').style.display = 'flex';
        }
        function updateModal() { document.getElementById('fullImage').src = globalImages[globalIdx].img; }
        window.slide = (v, e) => { e.stopPropagation(); globalIdx = Math.max(0, Math.min(globalImages.length - 1, globalIdx + v)); updateModal(); };
        window.closeModal = (e) => { if(e.target.id==='imageModal' || e.target.id==='fullImage') document.getElementById('imageModal').style.display='none'; };
    </script>
</body>
</html>
