<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dryfu Smart Secure</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #eef2f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Common Screen Styles */
        .card-screen {
            background: white;
            width: 100%;
            max-width: 350px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            display: none;
        }

        .card-screen h2 {
            color: #2563eb;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .input-box {
            width: 100%;
            padding: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
        }

        .primary-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        /* Quick Lock Screen */
        #quickLockScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #2563eb;
            color: white;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            display: none;
        }

        #quickLockScreen input {
            width: 80px;
            text-align: center;
            font-size: 2rem;
            background: white;
            border: none;
            border-radius: 10px;
            margin: 20px 0;
            color: #1e293b;
            font-weight: 800;
        }

        /* Main App Container */
        #appContainer {
            display: none;
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            position: relative;
            flex-direction: column;
            height: 100vh;
            max-height: 850px;
        }

        .header {
            background-color: #2563eb;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            font-weight: 600;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Calendar Styles */
        .calendar-section {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            background: #fafafa;
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .month-nav button {
            background: white;
            border: 1px solid #e2e8f0;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #e2e8f0;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }

        .day {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 42px;
            background: #ffffff;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .day.selected {
            background-color: #eff6ff;
            color: #2563eb;
            font-weight: 700;
            box-shadow: inset 0 0 0 1px #3b82f6;
        }

        .day.has-doc {
            border-bottom: 3px solid #3b82f6;
        }

        .day.empty {
            background: #f1f5f9;
            cursor: default;
        }

        .details-section {
            padding: 20px;
            background: white;
            flex-grow: 1;
            overflow-y: auto;
        }

        .add-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .doc-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            height: 115px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            cursor: pointer;
        }

        .doc-item {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .delete-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #ef4444;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Full Image Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 95%;
            max-height: 80%;
            border-radius: 8px;
            transition: transform 0.3s ease;
            object-fit: contain;
            /* Ye line nayi add ki hai */
        }

        /* Added transition for smooth rotate */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 10001;
        }

        .prev-btn {
            left: 10px;
        }

        .next-btn {
            right: 10px;
        }

        /* New Rotate Button */
        .rotate-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 10001;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 500px) {
            body {
                align-items: flex-start;
            }

            #appContainer {
                max-width: 100%;
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
        }
    </style>
</head>

<body onmousedown="resetTimers()" onkeypress="resetTimers()" ontouchstart="resetTimers()">

    <div id="loginScreen" class="card-screen">
        <i class="fa-solid fa-cloud-bolt" style="font-size: 3.5rem; color: #2563eb; margin-bottom: 20px;"></i>
        <h2>Dryfu Cloud</h2>
        <input type="email" id="loginEmail" class="input-box" placeholder="Email Address">
        <input type="password" id="loginPass" class="input-box" placeholder="Password">
        <button class="primary-btn" onclick="handleLogin()">Login to Diary</button>
        <p id="loginError" style="color: #ef4444; font-size: 0.85rem; margin-top: 15px; display: none;"></p>
    </div>

    <div id="quickLockScreen"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2563eb; color: white; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; display: none;">
        <i class="fa-solid fa-shield-halved" style="font-size: 4rem; margin-bottom: 10px;"></i>
        <h3 style="margin-bottom: 5px;">Locked for Security</h3>
        <input type="number" id="pinInput" placeholder="****" oninput="checkPin()"
            style="width: 120px; text-align: center; font-size: 2rem; background: white; border: none; border-radius: 10px; margin: 20px 0; color: #1e293b; font-weight: 800; letter-spacing: 5px;">
        <button onclick="handleLogout()"
            style="background:none; border:1px solid white; color:white; padding:5px 15px; border-radius:5px; font-size:0.7rem; cursor:pointer;">Logout
            Instead</button>
    </div>
    <div id="setupPinScreen" class="card-screen"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 10000; flex-direction: column; justify-content: center; align-items: center; display: none;">
        <i class="fa-solid fa-lock" style="font-size: 3rem; color: #2563eb; margin-bottom: 20px;"></i>
        <h2 style="color: #1e293b; margin-bottom: 5px;">Set Security PIN</h2>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px; text-align: center;">Choose a 4-digit PIN to
            secure your diary.</p>
        <input type="number" id="newPinInput" class="input-box" placeholder="Enter 4-Digit PIN"
            style="text-align: center; font-size: 1.5rem; letter-spacing: 5px; width: 80%; max-width: 250px;"
            maxlength="4" oninput="this.value=this.value.slice(0,4)">
        <button class="primary-btn" onclick="saveNewPin()" style="width: 80%; max-width: 250px; margin-top: 10px;">Save
            PIN</button>
    </div>

    <div id="appContainer">
        <div class="header">
            <span>DRYFU DIARY</span>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div class="calendar-section">
            <div class="month-nav">
                <button onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <h3 id="monthDisplay"></h3>
                <button onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="days-grid" id="calendarDays"></div>
        </div>

        <div class="details-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h4 id="displayDate" style="color: #475569;">Select Date</h4>
                <button class="add-btn" onclick="toggleUpload()"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div id="uploadBox"
                style="display:none; margin: 15px 0; padding: 15px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; justify-content: space-around; align-items:center;">
                <div onclick="document.getElementById('cameraInput').click()"
                    style="cursor:pointer; text-align:center;">
                    <i class="fa-solid fa-camera" style="font-size: 1.6rem; color: #2563eb;"></i><br><span
                        style="font-size:0.7rem; font-weight:600;">Camera</span>
                </div>
                <div onclick="document.getElementById('galleryInput').click()"
                    style="cursor:pointer; text-align:center;">
                    <i class="fa-solid fa-image" style="font-size: 1.6rem; color: #8b5cf6;"></i><br><span
                        style="font-size:0.7rem; font-weight:600;">Gallery</span>
                </div>
            </div>
            <div id="savedDocsContainer"></div>
        </div>
    </div>

    <input type="file" id="cameraInput" style="display:none" accept="image/*" capture="environment"
        onchange="savePhoto(event)">
    <input type="file" id="galleryInput" style="display:none" accept="image/*" onchange="savePhoto(event)">

    <div id="imageModal" class="modal">
        <button class="rotate-btn" onclick="rotateImage(event)"><i class="fa-solid fa-rotate-right"></i></button>
        <button class="nav-btn prev-btn" onclick="slide(-1, event)"><i class="fa-solid fa-chevron-left"></i></button>
        <img class="modal-content" id="fullImage">
        <button class="nav-btn next-btn" onclick="slide(1, event)"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA8jR1LbYSRmm-fAo3i5QChPqfCk1VUKgU",
            authDomain: "salebook-7405d.firebaseapp.com",
            projectId: "salebook-7405d",
            databaseURL: "https://salebook-7405d-default-rtdb.firebaseio.com/",
            appId: "1:193240940932:web:46fd3793cb7e2f10deddd1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const storage = firebase.storage(); // Nayi line add ki hai

        let nav = 0, selectedDate = "", cloudData = {};
        let lockTimer, logoutTimer;
        let globalImages = [], globalIdx = 0;
        let currentRotation = 0; // Added for tracking rotation

        // --- SECURITY TIMERS ---
        function resetTimers() {
            clearTimeout(lockTimer);
            clearTimeout(logoutTimer);
            lockTimer = setTimeout(() => { if (auth.currentUser) document.getElementById('quickLockScreen').style.display = 'flex'; }, 60000);
            logoutTimer = setTimeout(() => { if (auth.currentUser) handleLogout(); }, 180000);
        }

        let userCustomPin = ""; // Global variable jahan hum PIN store karenge

        // Naya function: Jab user pehli baar PIN set karega
        async function saveNewPin() {
            const newPin = document.getElementById('newPinInput').value;
            if (newPin.length !== 4) {
                alert("Please enter a 4-digit PIN.");
                return;
            }

            // Firebase mein user ki Settings ke andar PIN save karna
            const user = auth.currentUser;
            if (user) {
                await db.ref(`settings/${user.uid}/securityPin`).set(newPin);
                userCustomPin = newPin; // Variable update kar diya

                // Screen chhupana aur timers chalu karna
                document.getElementById('setupPinScreen').style.display = 'none';
                resetTimers();
            }
        }

        // Purana function Updated: Ab "aaj ki date" nahi, custom PIN check karega
        function checkPin() {
            const input = document.getElementById('pinInput').value;

            // Jab 4 digit pure ho jayein tabhi check karo
            if (input.length === 4) {
                if (input === userCustomPin) {
                    // PIN sahi hai! App open karo
                    document.getElementById('quickLockScreen').style.display = 'none';
                    document.getElementById('pinInput').value = ""; // Input clear kar do
                    resetTimers();
                } else {
                    // PIN galat hai
                    alert("Incorrect PIN!");
                    document.getElementById('pinInput').value = ""; // Galat pin hatayein
                }
            }
        }

        // --- AUTH LOGIC ---
        function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            auth.signInWithEmailAndPassword(email, pass).catch(err => {
                const e = document.getElementById('loginError');
                e.innerText = "Error: " + err.message;
                e.style.display = "block";
            });
        }

        function handleLogout() {
            auth.signOut();
            document.getElementById('quickLockScreen').style.display = 'none';
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';

                // --- NAYA HISSA SHURU ---
                // Database se check karo ki is user ka PIN kya hai
                db.ref(`settings/${user.uid}/securityPin`).once('value', snap => {
                    const savedPin = snap.val();
                    if (savedPin) {
                        // Agar PIN pehle se hai, toh usko global variable mein daal lo
                        userCustomPin = savedPin;
                        resetTimers();
                    } else {
                        // Agar PIN nahi hai (naya user), toh Setup Screen dikhao
                        document.getElementById('setupPinScreen').style.display = 'flex';
                    }
                });
                // --- NAYA HISSA KHATAM ---

                syncData();
            } else {
                document.getElementById('loginScreen').style.display = 'block';
                document.getElementById('appContainer').style.display = 'none';
                document.getElementById('setupPinScreen').style.display = 'none';
            }
        });

        // --- MISSING FUNCTIONS DATA SYNC & BUTTONS ---
        function syncData() {
            db.ref("documents").on('value', snap => {
                cloudData = snap.val() || {};

                if (!selectedDate) {
                    const dt = new Date();
                    selectedDate = `${dt.getFullYear()}-${(dt.getMonth() + 1).toString().padStart(2, '0')}-${dt.getDate().toString().padStart(2, '0')}`;
                    document.getElementById('displayDate').innerText = selectedDate;
                }

                renderCalendar();
                renderDocs(selectedDate);
            });
        }

        window.changeMonth = (v) => { nav += v; renderCalendar(); };
        window.toggleUpload = () => { const b = document.getElementById('uploadBox'); b.style.display = b.style.display === 'flex' ? 'none' : 'flex'; };

        function renderCalendar() {
            const dt = new Date();
            if (nav !== 0) dt.setMonth(new Date().getMonth() + nav);
            const month = dt.getMonth(), year = dt.getFullYear();
            document.getElementById('monthDisplay').innerText = `${new Intl.DateTimeFormat('en-US', { month: 'short' }).format(dt)} ${year}`;
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendarDays');
            grid.innerHTML = '';
            for (let i = 1; i <= 42; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day';
                if (i > firstDay && i <= firstDay + daysInMonth) {
                    const dNum = i - firstDay;
                    const dStr = `${year}-${(month + 1).toString().padStart(2, '0')}-${dNum.toString().padStart(2, '0')}`;
                    dayDiv.innerText = dNum;
                    if (cloudData[dStr]) dayDiv.classList.add('has-doc');
                    if (dStr === selectedDate) dayDiv.classList.add('selected');
                    dayDiv.onclick = () => { selectedDate = dStr; document.getElementById('displayDate').innerText = dStr; renderCalendar(); renderDocs(dStr); };
                } else { dayDiv.classList.add('empty'); }
                grid.appendChild(dayDiv);
            }
        }

        function renderDocs(date) {
            const container = document.getElementById('savedDocsContainer');
            const docs = cloudData[date] || [];
            if (docs.length === 0) { container.innerHTML = `<p style="text-align:center; color:#94a3b8; margin-top:20px;">Empty folder.</p>`; return; }
            let html = '<div class="doc-grid">';
            docs.forEach((img, i) => {
                html += `<div class="img-wrapper" onclick="openFull('${date}',${i})"><img src="${img}" class="doc-item"><button class="delete-btn" onclick="deleteImg(${i},event)"><i class="fa-solid fa-xmark"></i></button></div>`;
            });
            container.innerHTML = html + '</div>';
        }

        async function savePhoto(e) {
            const file = e.target.files[0];
            if (!file || !selectedDate) return;

            // Uploading text dikhayenge taaki user ko pata chale process chal raha hai
            const uploadBox = document.getElementById('uploadBox');
            const originalBoxHTML = uploadBox.innerHTML;
            uploadBox.innerHTML = '<p style="text-align:center; font-weight:600; color:#2563eb;">Uploading Securely... <i class="fa-solid fa-spinner fa-spin"></i></p>';

            const reader = new FileReader();
            reader.onload = async (ev) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 1000; let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);

                    // Canvas ko File (Blob) mein convert karna
                    canvas.toBlob(async (blob) => {
                        try {
                            // Firebase Storage mein upload karna
                            const user = auth.currentUser;
                            const fileName = `diary_images/${user.uid}/${selectedDate}/${Date.now()}.jpg`;
                            const storageRef = storage.ref().child(fileName);

                            const snapshot = await storageRef.put(blob);
                            const downloadURL = await snapshot.ref.getDownloadURL();

                            // Ab us Image ka URL Realtime Database mein save karna
                            const current = cloudData[selectedDate] || [];
                            current.push(downloadURL);
                            await db.ref(`documents/${selectedDate}`).set(current);

                            uploadBox.style.display = 'none';
                            uploadBox.innerHTML = originalBoxHTML; // UI wapas normal karna
                        } catch (err) {
                            alert("Upload Failed: " + err.message);
                            uploadBox.innerHTML = originalBoxHTML;
                        }
                    }, 'image/jpeg', 0.6); // 0.6 quality = compression
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }
        window.deleteImg = async (i, e) => {
            e.stopPropagation();
            if (confirm("Delete this photo permanently?")) {
                let d = cloudData[selectedDate];
                let imageUrl = d[i];

                // 1. Agar image Firebase Storage par hai, toh wahan se delete karein
                if (imageUrl.includes('firebasestorage')) {
                    try {
                        let imageRef = storage.refFromURL(imageUrl);
                        await imageRef.delete();
                    } catch (err) {
                        console.log("Storage se delete nahi ho payi:", err);
                    }
                }

                // 2. Realtime Database se entry delete karein
                d.splice(i, 1);
                if (d.length === 0) {
                    await db.ref(`documents/${selectedDate}`).remove();
                } else {
                    await db.ref(`documents/${selectedDate}`).set(d);
                }
            }
        };       // --- IMAGE MODAL & SWIPE LOGIC ---
        function openFull(date, i) {
            globalImages = [];
            Object.keys(cloudData).sort().forEach(d => cloudData[d].forEach(img => globalImages.push({ d, img })));
            globalIdx = globalImages.findIndex(item => item.d === date && item.img === cloudData[date][i]);
            updateModal(); document.getElementById('imageModal').style.display = 'flex';
        }

        function updateModal() {
            // CSS rotation ab jaruri nahi hai, bas source update karna kafi hai
            const imgEl = document.getElementById('fullImage');
            imgEl.style.transform = `rotate(0deg)`; // Reset any leftover transform
            imgEl.src = globalImages[globalIdx].img;
        }

        window.slide = (v, e) => {
            if (e) e.stopPropagation();
            globalIdx = Math.max(0, Math.min(globalImages.length - 1, globalIdx + v));
            updateModal();
        };

        window.rotateImage = async (e) => {
            e.stopPropagation();

            const rotateBtn = e.currentTarget;
            rotateBtn.disabled = true;
            rotateBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            const currentImgData = globalImages[globalIdx];
            const date = currentImgData.d;
            const oldImageUrl = currentImgData.img;

            try {
                // 1. Storage se photo ko download karke browser mein laana
                const response = await fetch(oldImageUrl);
                const blobData = await response.blob();
                const localUrl = URL.createObjectURL(blobData);

                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    canvas.width = img.height;
                    canvas.height = img.width;

                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.rotate(90 * Math.PI / 180);
                    ctx.drawImage(img, -img.width / 2, -img.height / 2);

                    // 2. Ghumi hui photo ko Canvas se nikalna
                    canvas.toBlob(async (blob) => {
                        try {
                            const user = auth.currentUser;

                            // 3. Nayi rotated photo ko Firebase Storage mein upload karna
                            const newFileName = `diary_images/${user.uid}/${date}/rotated_${Date.now()}.jpg`;
                            const storageRef = storage.ref().child(newFileName);
                            const snapshot = await storageRef.put(blob);
                            const newDownloadURL = await snapshot.ref.getDownloadURL();

                            // 4. Database mein purane link ki jagah naya link dalna
                            const indexInDate = cloudData[date].indexOf(oldImageUrl);
                            if (indexInDate !== -1) {
                                cloudData[date][indexInDate] = newDownloadURL;
                            }
                            globalImages[globalIdx].img = newDownloadURL;
                            await db.ref(`documents/${date}`).set(cloudData[date]);

                            // 5. UI Update aur purani photo ko Storage se permanently delete karna
                            document.getElementById('fullImage').src = newDownloadURL;
                            if (date === selectedDate) renderDocs(date);

                            if (oldImageUrl.includes('firebasestorage')) {
                                await storage.refFromURL(oldImageUrl).delete().catch(err => console.log("Old image delete skip:", err));
                            }

                            rotateBtn.disabled = false;
                            rotateBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
                        } catch (err) {
                            alert("Upload Failed: " + err.message);
                            rotateBtn.disabled = false;
                            rotateBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
                        }
                    }, 'image/jpeg', 0.8);
                };
                img.src = localUrl;

            } catch (err) {
                alert("Image fetch failed. Check connection.");
                rotateBtn.disabled = false;
                rotateBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
            }
        };
        // Close Modal by clicking outside
        document.getElementById('imageModal').addEventListener('click', function (e) {
            if (e.target.id === 'imageModal') {
                this.style.display = 'none';
            }
        });

        // Mobile Swipe Setup
        let touchStartX = 0;
        let touchEndX = 0;

        const modalEl = document.getElementById('imageModal');
        modalEl.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        modalEl.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) slide(1); // Swipe Left
            if (touchEndX > touchStartX + 50) slide(-1); // Swipe Right
        }

    </script>
</body>

</html>
